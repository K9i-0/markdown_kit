name: "Setup Application Runtime"
description: "Setup application runtime for Flutter"

runs:
  using: "composite"
  steps:
    - name: Setup Flutter
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        install_args: "flutter"

    - name: Install dependencies
      run: flutter pub get
      shell: bash
